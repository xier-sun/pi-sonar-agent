[project]
name = "pi-sonar-agent"
version = "1.0.0"
description = "SonarQube Code Issue Fix Agent based on Claude Code SDK"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Author", email = "author@example.com"}
]
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "dingtalk-stream>=0.16.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "anyio>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "mysql-connector-python>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
]

[project.scripts]
pi-sonar-agent = "pi_sonar_agent.main:main"
pi-sonar-dingtalk-gateway = "pi_sonar_agent.dingtalk_gateway:main"
pi-sonar-dingtalk-stream = "pi_sonar_agent.dingtalk_stream_service:main"
pi-sonar-dingtalk-worker = "pi_sonar_agent.dingtalk_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".agent_workspaces",
    ".scratch-buildscope",
    ".scratch-nochange",
    ".tmp",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
