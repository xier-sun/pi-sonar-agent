name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests run.py

      - name: Pytest
        run: python -m pytest -q
